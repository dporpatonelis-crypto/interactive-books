name: Build requested Digital Lessons revision
on:
  push:
    branches: [codex/quiz-links-20261019]
    paths:
      - Digital_Lessons/book.json
      - .github/workflows/digital-book-remote.yml
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/quiz-links-20261019
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Digital_Lessons/
            /.github/digital-book/
            !/Digital_Lessons/book.pdf
            !/Digital_Lessons/history/
            !/Digital_Lessons/assets/**/*.mp4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PDF renderer
        run: |
          npm install --prefix "$RUNNER_TEMP/book-render" playwright@1.62.1 --no-audit --no-fund
          "$RUNNER_TEMP/book-render/node_modules/.bin/playwright" install --with-deps chromium
          python3 -m pip install --disable-pip-version-check pypdf pymupdf
      - name: Build and render the retained reader
        env:
          NODE_PATH: ${{ runner.temp }}/book-render/node_modules
        run: |
          python3 .github/digital-book/build_book.py Digital_Lessons/book.json
          node .github/digital-book/render_pdf.cjs Digital_Lessons
          python3 .github/digital-book/check_pdf.py
      - name: Commit only generated book files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Digital_Lessons/data.json Digital_Lessons/book.pdf Digital_Lessons/pdf-meta.json Digital_Lessons/qa
          git diff --staged --quiet || git commit -m "Render Digital Lessons revision 24 and verify quiz links"
          git push origin HEAD:codex/quiz-links-20261019
